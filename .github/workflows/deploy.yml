# Every push to main: the same checks, then the app is built and published to GitHub
# Pages at roger-egito.github.io/<repository>/. The Publish workflow also runs it after
# committing a new content snapshot.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

# One deploy at a time. A newer push waits for the running deploy instead of cancelling
# it halfway.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/checks.yml

  build:
    needs: check
    runs-on: ubuntu-latest
    steps:
      # The latest main, not the commit that started the run: when Publish calls this,
      # its snapshot commit came after that one.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # The URL path is the repository's name, exactly as GitHub spells it.
      - run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
